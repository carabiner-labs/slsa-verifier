---
track: source
id: source-control-continuity-enforced
title: Source Provenance Declares CONTINUITY_ENFORCED
description: |
  Asserts the source provenance lists the CONTINUITY_ENFORCED control
  as active. Required for SLSA Source L2 — the repository owner has
  enforced that branch history cannot be rewritten or deleted.
slsaLevel: 2
checks:
  - predicateType: https://github.com/slsa-framework/slsa-source-poc/source-provenance/v1-draft
    expression: predicate.controls.exists(c, c.name == "CONTINUITY_ENFORCED")
