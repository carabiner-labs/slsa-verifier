---
track: source
id: source-control-provenance-available
title: Source Provenance Declares PROVENANCE_AVAILABLE
description: |
  Asserts the source provenance lists the PROVENANCE_AVAILABLE control
  as active. Required for SLSA Source L3 — every commit on the
  protected branch is itself attested with source provenance, making
  history traversable end-to-end.
slsaLevel: 3
checks:
  - predicateType: https://github.com/slsa-framework/slsa-source-poc/source-provenance/v1-draft
    expression: predicate.controls.exists(c, c.name == "PROVENANCE_AVAILABLE")
