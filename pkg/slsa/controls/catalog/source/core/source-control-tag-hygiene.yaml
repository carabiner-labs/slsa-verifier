---
track: source
id: source-control-tag-hygiene
title: Source Provenance Declares TAG_HYGIENE
description: |
  Asserts the source provenance lists the TAG_HYGIENE control as
  active. Required for SLSA Source L2 — tags cannot be rewritten or
  reused to point at different commits over time.
slsaLevel: 2
checks:
  - predicateType: https://github.com/slsa-framework/slsa-source-poc/source-provenance/v1-draft
    expression: predicate.controls.exists(c, c.name == "TAG_HYGIENE")
