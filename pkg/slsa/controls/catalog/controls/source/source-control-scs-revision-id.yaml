---
track: source
id: source-control-scs-revision-id
title: Source Provenance Declares SLSA_SOURCE_SCS_REVISION_ID
description: |
  Asserts the source provenance lists the SLSA_SOURCE_SCS_REVISION_ID
  control as active before the provenance was issued. Required for
  SLSA Source L1 — every revision has an immutable identifier (e.g.
  the git commit digest).
checks:
  - predicateType: https://github.com/slsa-framework/slsa-source-poc/source-provenance/v1-draft
    expression: >-
      predicate.controls.exists(c, c.name == "SLSA_SOURCE_SCS_REVISION_ID"
      && c.since <= predicate.createdOn
      && (!('enforced_since' in params) || c.since <= timestamp(string(params.enforced_since))))
  - predicateType: https://github.com/slsa-framework/source-tool/source-provenance/v1
    expression: >-
      predicate.controls.exists(c, c.name == "SLSA_SOURCE_SCS_REVISION_ID"
      && c.since <= predicate.createdOn
      && (!('enforced_since' in params) || c.since <= timestamp(string(params.enforced_since))))
