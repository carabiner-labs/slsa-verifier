---
track: source
id: source-control-scs-continuity
title: Source Provenance Declares SLSA_SOURCE_SCS_CONTINUITY
description: |
  Asserts the source provenance lists the SLSA_SOURCE_SCS_CONTINUITY
  control (or its deprecated alias CONTINUITY_ENFORCED) as active
  before the provenance was issued. Required for SLSA Source L2 —
  protected branch history cannot be rewritten or deleted.
slsaLevel: 2
checks:
  - predicateType: https://github.com/slsa-framework/slsa-source-poc/source-provenance/v1-draft
    expression: >-
      predicate.controls.exists(c, c.name in ["SLSA_SOURCE_SCS_CONTINUITY", "CONTINUITY_ENFORCED"]
      && c.since <= predicate.createdOn
      && (!('enforced_since' in params) || c.since <= timestamp(string(params.enforced_since))))
