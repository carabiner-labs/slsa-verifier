#
# A tag does not establish a SLSA source level through its own control
# set: it inherits the levels recorded in the VSA summaries copied from
# the branch VSAs that covered the tagged commit. One control per level
# lets the verifier's level computation reproduce that inheritance.
#
# Levels are matched by exact membership in the set of level names at
# or above the control's level: a string comparison would rank any
# unknown "SLSA_SOURCE_LEVEL_*" entry above every real level. When the
# caller states an expected branch, the level must come from a summary
# covering that branch, so a tag cut from a lower-level branch cannot
# borrow the level of another branch's summary.
---
track: source
id: source-tag-vsa-level-1
title: Tag VSA Summaries Attest SLSA Source L1
description: |
  Asserts a VSA summary in the tag provenance records the tagged commit
  as verified at SLSA Source L1 or higher — for the expected branch,
  when one is given.
checks:
  - predicateType: https://github.com/slsa-framework/slsa-source-poc/tag-provenance/v1-draft
    expression: >-
      predicate.vsaSummaries.exists(s,
      (!('expected_branch' in params) || string(params.expected_branch) in s.sourceRefs)
      && s.verifiedLevels.exists(l, l in ["SLSA_SOURCE_LEVEL_1", "SLSA_SOURCE_LEVEL_2", "SLSA_SOURCE_LEVEL_3", "SLSA_SOURCE_LEVEL_4"]))
  - predicateType: https://github.com/slsa-framework/source-tool/tag-provenance/v1
    expression: >-
      predicate.vsaSummaries.exists(s,
      (!('expected_branch' in params) || string(params.expected_branch) in s.sourceRefs)
      && s.verifiedLevels.exists(l, l in ["SLSA_SOURCE_LEVEL_1", "SLSA_SOURCE_LEVEL_2", "SLSA_SOURCE_LEVEL_3", "SLSA_SOURCE_LEVEL_4"]))
