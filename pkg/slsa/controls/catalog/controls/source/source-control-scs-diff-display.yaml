---
track: source
id: source-control-scs-diff-display
title: Source Provenance Declares SLSA_SOURCE_SCS_DIFF_DISPLAY
description: |
  Asserts the source provenance lists the SLSA_SOURCE_SCS_DIFF_DISPLAY
  control as active before the provenance was issued. Required for
  SLSA Source L1 — the source control system can display the changes
  between any two revisions.
checks:
  - predicateType: https://github.com/slsa-framework/slsa-source-poc/source-provenance/v1-draft
    expression: >-
      predicate.controls.exists(c, c.name == "SLSA_SOURCE_SCS_DIFF_DISPLAY"
      && has(c.since) && c.since <= predicate.createdOn
      && (!('enforced_since' in params) || c.since <= timestamp(string(params.enforced_since))))
  - predicateType: https://github.com/slsa-framework/source-tool/source-provenance/v1
    expression: >-
      predicate.controls.exists(c, c.name == "SLSA_SOURCE_SCS_DIFF_DISPLAY"
      && has(c.since) && c.since <= predicate.createdOn
      && (!('enforced_since' in params) || c.since <= timestamp(string(params.enforced_since))))
