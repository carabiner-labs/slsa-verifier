---
track: source
id: source-repo-match
title: Source Repository Matches Expected URI
description: |
  Asserts the SLSA source provenance was produced from the expected
  repository URI. An identity check at L1 — equivalent to the
  source-repo-match control on the build side. Skipped when the caller
  does not state an expected repository.
checks:
  - predicateType: https://github.com/slsa-framework/slsa-source-poc/source-provenance/v1-draft
    expression: predicate.repoUri == params.expected_source_repo
    optionalParameters:
      - expected_source_repo
