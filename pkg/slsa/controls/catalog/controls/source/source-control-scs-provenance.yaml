---
track: source
id: source-control-scs-provenance
title: Source Provenance Declares SLSA_SOURCE_SCS_PROVENANCE
description: |
  Asserts the source provenance lists the SLSA_SOURCE_SCS_PROVENANCE
  control (or its deprecated alias PROVENANCE_AVAILABLE) as active
  before the provenance was issued. Required for SLSA Source L2 — the
  source control system issues source provenance attestations for
  revisions on protected branches.
checks:
  - predicateType: https://github.com/slsa-framework/slsa-source-poc/source-provenance/v1-draft
    expression: >-
      predicate.controls.exists(c, c.name in ["SLSA_SOURCE_SCS_PROVENANCE", "PROVENANCE_AVAILABLE"]
      && c.since <= predicate.createdOn
      && (!('enforced_since' in params) || c.since <= timestamp(string(params.enforced_since))))
