#
# BuildType controls for provenance produced on GitHub Actions by the
# slsa-github-generator family (v0.2 and v1 forms) and by GitHub's own
# artifact attestations. They read the triggering event the builder
# recorded — invocation.environment.github_* for v0.2 provenance,
# buildDefinition.internalParameters.GITHUB_* for v1 provenance, and
# buildDefinition.externalParameters.workflow.ref for GitHub attestations
# — and compare it with the caller's expectations, given as --param.
# Each expectation is optional: a control whose parameter is not set is
# skipped. With none of them set the verifier refuses to run, so a
# builder the catalog knows is never verified with no expectation stated.
---
track: build
id: github-source-branch
title: Built From Expected Branch
description: |
  Asserts the build was triggered from the expected branch, given as
  expected_branch (refs/heads/main or main). For a build triggered by a
  tag, the branch is taken from github_base_ref when the builder recorded
  one, else from the event: a push event's base_ref or a release event's
  target_commitish. Other tag triggers carry no branch, so the
  expectation cannot be met on them.
checks:
  - predicateType: https://slsa.dev/provenance/v0.2
    buildTypes:
      - https://github.com/slsa-framework/slsa-github-generator/generic@v1
      - https://github.com/slsa-framework/slsa-github-generator/go@v1
      - https://github.com/slsa-framework/slsa-github-generator-go@v1
      - https://github.com/slsa-framework/slsa-github-generator@v1
      - https://github.com/slsa-framework/slsa-github-generator/container@v1
    expression: >-
      has(predicate.invocation.environment.github_ref_type) && (
        (predicate.invocation.environment.github_ref_type == "branch" && predicate.invocation.environment.github_ref in ["refs/heads/" + string(params.expected_branch), string(params.expected_branch)])
        || (predicate.invocation.environment.github_ref_type == "tag" && (
          (has(predicate.invocation.environment.github_base_ref) && predicate.invocation.environment.github_base_ref != "" && predicate.invocation.environment.github_base_ref in ["refs/heads/" + string(params.expected_branch), string(params.expected_branch)])
          || (has(predicate.invocation.environment.github_event_name) && predicate.invocation.environment.github_event_name == "push"
              && has(predicate.invocation.environment.github_event_payload.base_ref) && predicate.invocation.environment.github_event_payload.base_ref in ["refs/heads/" + string(params.expected_branch), string(params.expected_branch)])
          || (has(predicate.invocation.environment.github_event_name) && predicate.invocation.environment.github_event_name == "release"
              && has(predicate.invocation.environment.github_event_payload.release.target_commitish)
              && ("refs/heads/" + string(predicate.invocation.environment.github_event_payload.release.target_commitish)) in ["refs/heads/" + string(params.expected_branch), string(params.expected_branch)])
        ))
      )
    optionalParameters:
      - expected_branch
  - predicateType: https://slsa.dev/provenance/v1
    buildTypes:
      - https://github.com/slsa-framework/slsa-github-generator/delegator-generic@v0
      - https://slsa-framework.github.io/github-actions-buildtypes/workflow/v1
      - https://slsa.dev/container-based-build/v0.1
      - https://slsa.dev/container-based-build/v0.1?draft
    expression: >-
      has(predicate.buildDefinition.internalParameters.GITHUB_REF_TYPE) && (
        (predicate.buildDefinition.internalParameters.GITHUB_REF_TYPE == "branch" && predicate.buildDefinition.internalParameters.GITHUB_REF in ["refs/heads/" + string(params.expected_branch), string(params.expected_branch)])
        || (predicate.buildDefinition.internalParameters.GITHUB_REF_TYPE == "tag" && (
          (has(predicate.buildDefinition.internalParameters.GITHUB_BASE_REF) && predicate.buildDefinition.internalParameters.GITHUB_BASE_REF != "" && predicate.buildDefinition.internalParameters.GITHUB_BASE_REF in ["refs/heads/" + string(params.expected_branch), string(params.expected_branch)])
          || (has(predicate.buildDefinition.internalParameters.GITHUB_EVENT_NAME) && predicate.buildDefinition.internalParameters.GITHUB_EVENT_NAME == "push"
              && has(predicate.buildDefinition.internalParameters.GITHUB_EVENT_PAYLOAD.base_ref) && predicate.buildDefinition.internalParameters.GITHUB_EVENT_PAYLOAD.base_ref in ["refs/heads/" + string(params.expected_branch), string(params.expected_branch)])
          || (has(predicate.buildDefinition.internalParameters.GITHUB_EVENT_NAME) && predicate.buildDefinition.internalParameters.GITHUB_EVENT_NAME == "release"
              && has(predicate.buildDefinition.internalParameters.GITHUB_EVENT_PAYLOAD.release.target_commitish)
              && ("refs/heads/" + string(predicate.buildDefinition.internalParameters.GITHUB_EVENT_PAYLOAD.release.target_commitish)) in ["refs/heads/" + string(params.expected_branch), string(params.expected_branch)])
        ))
      )
    optionalParameters:
      - expected_branch
  - predicateType: https://slsa.dev/provenance/v1
    buildTypes:
      - https://actions.github.io/buildtypes/workflow/v1
    expression: >-
      has(predicate.buildDefinition.externalParameters.workflow.ref) && predicate.buildDefinition.externalParameters.workflow.ref in ["refs/heads/" + string(params.expected_branch), string(params.expected_branch)]
    optionalParameters:
      - expected_branch
