#
# BuildType controls for provenance produced on GitHub Actions by the
# slsa-github-generator family (v0.2 and v1 forms) and by GitHub's own
# artifact attestations. They read the triggering event the builder
# recorded — invocation.environment.github_* for v0.2 provenance,
# buildDefinition.internalParameters.GITHUB_* for v1 provenance, and
# buildDefinition.externalParameters.workflow.ref for GitHub attestations
# — and compare it with the caller's expectations, given as --param.
# Fields a builder may omit are read with CEL optionals (a.?b.orValue),
# so a missing field reads as empty instead of erroring.
# Each expectation is optional: a control whose parameter is not set is
# skipped. With none of them set the verifier refuses to run, so a
# builder the catalog knows is never verified with no expectation stated.
---
track: build
id: github-source-branch
title: Built From Expected Branch
description: |
  Asserts the build was triggered from the expected branch, given as
  expected_branch (refs/heads/main or main). For a build triggered by a
  tag, the branch is taken from github_base_ref when the builder recorded
  one, else from the event: a push event's base_ref or a release event's
  target_commitish. Other tag triggers carry no branch, so the
  expectation cannot be met on them.
checks:
  - predicateType: https://slsa.dev/provenance/v0.2
    buildTypes:
      - https://github.com/slsa-framework/slsa-github-generator/generic@v1
      - https://github.com/slsa-framework/slsa-github-generator/go@v1
      - https://github.com/slsa-framework/slsa-github-generator-go@v1
      - https://github.com/slsa-framework/slsa-github-generator@v1
      - https://github.com/slsa-framework/slsa-github-generator/container@v1
    expression: >-
      (predicate.invocation.environment.?github_ref_type.orValue("") == "branch" && predicate.invocation.environment.?github_ref.orValue("") in ["refs/heads/" + string(params.expected_branch), string(params.expected_branch)])
      || (predicate.invocation.environment.?github_ref_type.orValue("") == "tag"
          && optional.ofNonZeroValue(predicate.invocation.environment.?github_base_ref.orValue(""))
             .or(predicate.invocation.environment.?github_event_name.orValue("") == "push" ? predicate.invocation.environment.?github_event_payload.?base_ref : optional.none())
             .or(predicate.invocation.environment.?github_event_name.orValue("") == "release"
                 ? optional.ofNonZeroValue(predicate.invocation.environment.?github_event_payload.?release.?target_commitish.orValue("")).optMap(c, "refs/heads/" + string(c))
                 : optional.none())
             .orValue("") in ["refs/heads/" + string(params.expected_branch), string(params.expected_branch)])
    optionalParameters:
      - expected_branch
  - predicateType: https://slsa.dev/provenance/v1
    buildTypes:
      - https://github.com/slsa-framework/slsa-github-generator/delegator-generic@v0
      - https://slsa-framework.github.io/github-actions-buildtypes/workflow/v1
      - https://slsa.dev/container-based-build/v0.1
      - https://slsa.dev/container-based-build/v0.1?draft
    expression: >-
      (predicate.buildDefinition.internalParameters.?GITHUB_REF_TYPE.orValue("") == "branch" && predicate.buildDefinition.internalParameters.?GITHUB_REF.orValue("") in ["refs/heads/" + string(params.expected_branch), string(params.expected_branch)])
      || (predicate.buildDefinition.internalParameters.?GITHUB_REF_TYPE.orValue("") == "tag"
          && optional.ofNonZeroValue(predicate.buildDefinition.internalParameters.?GITHUB_BASE_REF.orValue(""))
             .or(predicate.buildDefinition.internalParameters.?GITHUB_EVENT_NAME.orValue("") == "push" ? predicate.buildDefinition.internalParameters.?GITHUB_EVENT_PAYLOAD.?base_ref : optional.none())
             .or(predicate.buildDefinition.internalParameters.?GITHUB_EVENT_NAME.orValue("") == "release"
                 ? optional.ofNonZeroValue(predicate.buildDefinition.internalParameters.?GITHUB_EVENT_PAYLOAD.?release.?target_commitish.orValue("")).optMap(c, "refs/heads/" + string(c))
                 : optional.none())
             .orValue("") in ["refs/heads/" + string(params.expected_branch), string(params.expected_branch)])
    optionalParameters:
      - expected_branch
  - predicateType: https://slsa.dev/provenance/v1
    buildTypes:
      - https://actions.github.io/buildtypes/workflow/v1
    expression: >-
      predicate.buildDefinition.externalParameters.?workflow.?ref.orValue("") in ["refs/heads/" + string(params.expected_branch), string(params.expected_branch)]
    optionalParameters:
      - expected_branch
