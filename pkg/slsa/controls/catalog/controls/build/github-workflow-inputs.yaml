#
# BuildType controls for provenance produced on GitHub Actions by the
# slsa-github-generator family (v0.2 and v1 forms) and by GitHub's own
# artifact attestations. They read the triggering event the builder
# recorded — invocation.environment.github_* for v0.2 provenance,
# buildDefinition.internalParameters.GITHUB_* for v1 provenance, and
# buildDefinition.externalParameters.workflow.ref for GitHub attestations
# — and compare it with the caller's expectations, given as --param.
# Each expectation is optional: a control whose parameter is not set is
# skipped. With none of them set the verifier refuses to run, so a
# builder the catalog knows is never verified with no expectation stated.
---
track: build
id: github-workflow-inputs
title: Built With Expected Workflow Inputs
description: |
  Asserts the build was triggered by workflow_dispatch with every
  expected input, given as expected_workflow_inputs, a list of
  name=value entries (--param 'expected_workflow_inputs:[release=true,
  channel=stable]'). Every entry must be present with that value; a
  build triggered any other way cannot meet the expectation.
checks:
  - predicateType: https://slsa.dev/provenance/v0.2
    buildTypes:
      - https://github.com/slsa-framework/slsa-github-generator/generic@v1
      - https://github.com/slsa-framework/slsa-github-generator/go@v1
      - https://github.com/slsa-framework/slsa-github-generator-go@v1
      - https://github.com/slsa-framework/slsa-github-generator@v1
      - https://github.com/slsa-framework/slsa-github-generator/container@v1
    expression: >-
      has(predicate.invocation.environment.github_event_name) && predicate.invocation.environment.github_event_name == "workflow_dispatch"
      && has(predicate.invocation.environment.github_event_payload.inputs)
      && params.expected_workflow_inputs.all(kv,
           predicate.invocation.environment.github_event_payload.inputs.exists(k, k + "=" + string(predicate.invocation.environment.github_event_payload.inputs[k]) == kv))
    optionalParameters:
      - expected_workflow_inputs
  - predicateType: https://slsa.dev/provenance/v1
    buildTypes:
      - https://github.com/slsa-framework/slsa-github-generator/delegator-generic@v0
      - https://slsa-framework.github.io/github-actions-buildtypes/workflow/v1
      - https://slsa.dev/container-based-build/v0.1
      - https://slsa.dev/container-based-build/v0.1?draft
    expression: >-
      has(predicate.buildDefinition.internalParameters.GITHUB_EVENT_NAME) && predicate.buildDefinition.internalParameters.GITHUB_EVENT_NAME == "workflow_dispatch"
      && has(predicate.buildDefinition.internalParameters.GITHUB_EVENT_PAYLOAD.inputs)
      && params.expected_workflow_inputs.all(kv,
           predicate.buildDefinition.internalParameters.GITHUB_EVENT_PAYLOAD.inputs.exists(k, k + "=" + string(predicate.buildDefinition.internalParameters.GITHUB_EVENT_PAYLOAD.inputs[k]) == kv))
    optionalParameters:
      - expected_workflow_inputs
